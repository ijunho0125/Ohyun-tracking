<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보축전 2026 - 테트리스 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #05060f;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.08) 0%, transparent 50%),
                linear-gradient(to bottom, #04050a, #0a0c16);
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .neon-glow-cyan {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .cyber-panel {
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(0, 243, 255, 0.4);
            box-shadow: 
                0 0 25px rgba(0, 243, 255, 0.15),
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(0, 243, 255, 0.08);
        }

        .btn-touch {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: transform 0.05s ease, filter 0.05s ease;
        }

        .btn-touch:active {
            transform: scale(0.92);
            filter: brightness(1.4);
        }

        /* 어두운 무지개 LED 그라데이션 테두리 애니메이션 */
        .animated-border {
            position: relative;
            background-clip: padding-box;
        }

        .animated-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            padding: 2px;
            background: linear-gradient(135deg, #1e0050, #41106e, #73007a, #85003f, #883000, #005f7a, #326b48, #1e0050);
            background-size: 400% 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderGlow 8s linear infinite;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(115, 0, 122, 0.4);
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .shake {
            animation: shake-anim 0.18s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-anim {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 text-white">

    <div class="w-full max-w-lg flex flex-col items-center my-auto">
        <!-- 타이틀 헤더 -->
        <header class="w-full text-center mb-2 flex flex-col items-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/50 border border-cyan-500/30 text-[11px] text-cyan-400 font-bold uppercase tracking-widest mb-1">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> 정보축전 2026 SPECIAL EDITION
            </div>
            <h1 class="text-3xl sm:text-4xl font-black font-orbitron tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500 neon-glow-cyan">
                NEON TETRIS
            </h1>
        </header>

        <!-- 메인 게임 컨테이너 -->
        <div id="game-container" class="relative w-full cyber-panel rounded-3xl p-4 sm:p-5 animated-border flex flex-col items-center">
            
            <!-- 상단 스탯 대시보드 -->
            <div class="w-full grid grid-cols-3 gap-2 mb-3 bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                <div class="text-center">
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">SCORE</div>

                <div class="text-center border-x border-slate-800">
                    <div class="text-[10px] text-yellow-400 font-bold uppercase tracking-wider">HIGH SCORE</div>

                <div class="text-center">

                </div>
            </div>

            <!-- 하드모드 장애물 경고 알림 바 -->
            <div id="obstacle-alert" class="w-full mb-3 hidden bg-red-950/60 border border-red-500/50 rounded-xl px-3 py-1.5 flex justify-between items-center text-xs text-red-300 font-bold animate-pulse">
                <span>⚠️ 방해 블록 타이머</span>
                <span id="ui-obstacle-timer" class="font-orbitron text-sm text-yellow-400">30s</span>

            <!-- 캔버스 및 NEXT 미리보기 레이아웃 -->
            <div class="flex gap-3 sm:gap-4 justify-center items-start w-full">
                <!-- 게임 보드 캔버스 -->
                <div class="relative rounded-2xl overflow-hidden border-2 border-cyan-400/50 shadow-[0_0_20px_rgba(0,243,255,0.25)] bg-slate-950/90">
                    <canvas id="tetrisCanvas" width="220" height="440" class="block"></canvas>
                    
                    <!-- 오버레이 화면 (모드 선택 및 메인 메뉴 / 게임오버) -->
                    <div id="overlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center transition-opacity duration-300 z-20">
                        <div id="overlay-content" class="flex flex-col items-center w-full max-w-xs space-y-4">

                            <p id="overlay-sub" class="text-xs text-slate-300 leading-relaxed">원하는 난이도를 선택하여 시작하세요</p>
                            
                            <!-- 난이도 선택 버튼 -->
                            <div class="w-full space-y-2 pt-2">
                                <button id="btn-mode-easy" class="w-full py-3 px-4 bg-emerald-950/80 hover:bg-emerald-800/80 border border-emerald-500/60 rounded-xl text-emerald-300 font-bold text-sm tracking-wide transition-all shadow-lg flex items-center justify-between">
                                    <span>🌱 쉬움 (EASY)</span>
                                    <span class="text-[10px] bg-emerald-900/80 px-2 py-0.5 rounded text-emerald-200">기존 속도</span>

                                <button id="btn-mode-hard" class="w-full py-3 px-4 bg-rose-950/80 hover:bg-rose-800/80 border border-rose-500/60 rounded-xl text-rose-300 font-bold text-sm tracking-wide transition-all shadow-lg flex items-center justify-between">
                                    <span>🔥 어려움 (HARD)</span>
                                    <span class="text-[10px] bg-rose-900/80 px-2 py-0.5 rounded text-rose-200">고속 + 30s 방해블록</span>

                </div>

                <!-- 오른쪽 정보/NEXT 패널 -->
                <div class="flex flex-col gap-2.5 w-28 sm:w-32">
                    <!-- NEXT 박스 -->

                        <span class="text-[10px] font-bold text-slate-400 tracking-wider mb-2 uppercase">NEXT</span>

                    </button>
                    <button id="btn-sound" class="w-full py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 flex items-center justify-center gap-1 transition">
                        🔊 SFX: ON

                    <button id="btn-fullscreen" class="w-full py-2 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 flex items-center justify-center gap-1 transition">

            <!-- 온스크린 모바일/터치 콘트롤러 -->
            <div class="w-full grid grid-cols-5 gap-1.5 mt-4 pt-3 border-t border-slate-800/80">
                <button id="ctrl-left" class="btn-touch py-3 bg-slate-800/80 border border-slate-700 rounded-xl flex items-center justify-center text-xl active:bg-cyan-600">◀</button>
                <button id="ctrl-rotate" class="btn-touch py-3 bg-slate-800/80 border border-slate-700 rounded-xl flex items-center justify-center text-xl active:bg-cyan-600">↻</button>
                <button id="ctrl-right" class="btn-touch py-3 bg-slate-800/80 border border-slate-700 rounded-xl flex items-center justify-center text-xl active:bg-cyan-600">▶</button>
                <button id="ctrl-down" class="btn-touch py-3 bg-slate-800/80 border border-slate-700 rounded-xl flex items-center justify-center text-xl active:bg-cyan-600">▼</button>
                <button id="ctrl-harddrop" class="btn-touch py-3 bg-gradient-to-r from-pink-600 to-purple-600 border border-pink-500/80 rounded-xl flex items-center justify-center text-xs font-black active:scale-95">DROP</button>
            </div>
        </div>

        <!-- 하단 조작 가이드 -->
        <footer class="mt-3 text-center text-[11px] text-slate-400 space-y-0.5">
            <p>⌨️ 키보드: 방향키(이동/회전/소프트드롭) | 스페이스바(하드드롭)</p>
            <p>R(재시작) | ESC(메인) | F11(전체화면)</p>
        </footer>
    </div>

    <script>
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.sfxEnabled = true;
                this.bgmEnabled = false;
                this.bgmTimer = null;
                this.noteIndex = 0;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playMove() {
                if (!this.sfxEnabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playRotate() {
                if (!this.sfxEnabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(640, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            playDrop() {
                if (!this.sfxEnabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playClear() {
                if (!this.sfxEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.05);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.05 + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.1);
                });
            }

            playWarning() {
                if (!this.sfxEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playGameOver() {
                if (!this.sfxEnabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }

            toggleBGM() {
                this.init();
                this.bgmEnabled = !this.bgmEnabled;
                if (this.bgmEnabled) {
                    this.startBGM();
                } else {
                    this.stopBGM();
                }
                return this.bgmEnabled;
            }

            startBGM() {
                if (this.bgmTimer) clearInterval(this.bgmTimer);
                const melody = [
                    659.25, 493.88, 523.25, 587.33, 523.25, 493.88, 440.00, 440.00,
                    523.25, 659.25, 587.33, 523.25, 493.88, 523.25, 587.33, 659.25,
                    523.25, 440.00, 440.00, 0,      587.33, 698.46, 880.00, 783.99,
                    698.46, 659.25, 523.25, 659.25, 587.33, 523.25, 493.88, 493.88
                ];
                this.noteIndex = 0;
                
                this.bgmTimer = setInterval(() => {
                    if (!this.bgmEnabled || !this.ctx) return;
                    const freq = melody[this.noteIndex % melody.length];
                    this.noteIndex++;

                    if (freq > 0) {
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.02, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.16);
                    }
                }, 180);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        const audioEngine = new AudioEngine();

        const canvas = document.getElementById("tetrisCanvas");
        const ctx = canvas.getContext("2d");
        const nextCanvas = document.getElementById("nextCanvas");
        const nextCtx = nextCanvas.getContext("2d");
        const danceCanvas = document.getElementById("danceCanvas");
        const danceCtx = danceCanvas.getContext("2d");

        const COLORS = [
            null,
            "#00f3ff", // 1. I - Bright Cyan
            "#ff0055", // 2. Z - Vibrant Pink
            "#00ff66", // 3. S - Bright Green
            "#ff9900", // 4. J - Orange
            "#2277ff", // 5. L - Royal Blue
            "#ffee00", // 6. O - Yellow
            "#d000ff", // 7. T - Neon Purple
        ];

        const FIGURES = [
            [[1, 5, 9, 13], [4, 5, 6, 7]],                             // I
            [[4, 5, 9, 10], [2, 6, 5, 9]],                             // Z
            [[6, 7, 9, 10], [1, 5, 6, 10]],                            // S
            [[1, 5, 9, 8], [0, 4, 5, 6], [1, 2, 5, 9], [4, 5, 6, 10]],  // J
            [[1, 5, 9, 10], [4, 5, 6, 2], [1, 2, 6, 10], [4, 5, 6, 8]], // L
            [[1, 2, 5, 6]],                                            // O
            [[1, 4, 5, 6], [1, 5, 6, 9], [4, 5, 6, 9], [1, 4, 5, 9]]   // T
        ];

        class Figure {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = Math.floor(Math.random() * FIGURES.length);
                this.color = Math.floor(Math.random() * (COLORS.length - 1)) + 1;
                this.rotation = 0;
            }

            image() {
                return FIGURES[this.type][this.rotation];
            }

            rotate() {
                this.rotation = (this.rotation + 1) % FIGURES[this.type].length;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw(targetCtx) {
                targetCtx.save();
                targetCtx.globalAlpha = Math.max(0, this.alpha);
                targetCtx.fillStyle = this.color;
                targetCtx.fillRect(this.x, this.y, this.size, this.size);
                targetCtx.restore();
            }
        }

        let particles = [];

        class TetrisGame {
            constructor(height, width) {
                this.height = height;
                this.width = width;
                this.zoom = 22;
                this.score = 0;
                this.linesCleared = 0;
                this.highScore = parseInt(localStorage.getItem("neon_tetris_highscore") || "0");
                this.state = "main_menu"; // main_menu | playing | gameover
                this.mode = "EASY"; // EASY | HARD
                this.field = Array.from({ length: height }, () => Array(width).fill(0));
                this.figure = null;
                this.nextFigure = null;
                
                this.obstacleTimer = 30;
                this.lastObstacleTime = Date.now();

                // 이인자 기분치 (0 ~ 100)
                this.injahMood = 50;
                this.lastScoreTime = Date.now();

                // 착지 유예(Lock Delay) 변수
                this.lockDelay = 0;
                this.lockResetCount = 0;
                this.maxLockResets = 15;
            }

            startGame(mode) {
                this.mode = mode;
                this.score = 0;
                this.linesCleared = 0;
                this.state = "playing";
                this.field = Array.from({ length: this.height }, () => Array(this.width).fill(0));
                this.figure = null;
                this.nextFigure = null;
                this.obstacleTimer = 30;
                this.lastObstacleTime = Date.now();
                this.injahMood = 50;
                this.lastScoreTime = Date.now();
                this.lockDelay = 0;
                this.lockResetCount = 0;
                this.newFigure();
                updateUI();
            }

            newFigure() {
                if (!this.nextFigure) {
                    this.nextFigure = new Figure(3, 0);
                }
                this.figure = this.nextFigure;
                this.figure.x = 3;
                this.figure.y = 0;
                this.nextFigure = new Figure(3, 0);

                this.lockDelay = 0;
                this.lockResetCount = 0;
                softDropLocked = true;
            }

            // 현재 블록이 바닥이나 다른 블록 바로 위에 접촉해 있는지 확인
            isTouchGround() {
                if (!this.figure) return false;
                this.figure.y++;
                const touched = this.intersects();
                this.figure.y--;
                return touched;
            }

            // 바닥 조작 성공 시 유예 타이머 초기화 (최대 리셋 횟수 제한)
            onPieceMoved() {
                if (this.isTouchGround()) {
                    if (this.lockResetCount < this.maxLockResets) {
                        this.lockDelay = 0;
                        this.lockResetCount++;
                    }
                } else {
                    this.lockDelay = 0;
                }
            }

            intersects(figureToCheck = this.figure) {
                const img = figureToCheck.image();
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (img.includes(i * 4 + j)) {
                            if (
                                i + figureToCheck.y > this.height - 1 ||
                                j + figureToCheck.x > this.width - 1 ||
                                j + figureToCheck.x < 0 ||
                                this.field[i + figureToCheck.y][j + figureToCheck.x] > 0
                            ) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            getGhostY() {
                if (!this.figure) return 0;
                let ghostY = this.figure.y;
                while (true) {
                    ghostY++;
                    const tempFig = {
                        image: () => this.figure.image(),
                        x: this.figure.x,
                        y: ghostY
                    };
                    if (this.intersects(tempFig)) {
                        return ghostY - 1;
                    }
                }
            }

            spawnObstacleRow() {
                audioEngine.playWarning();
                triggerScreenShake();

                for (let i = 0; i < this.height - 1; i++) {
                    this.field[i] = [...this.field[i + 1]];
                }

                const newRow = Array(this.width).fill(0);
                const obstacleCol1 = Math.floor(Math.random() * this.width);
                let obstacleCol2 = Math.floor(Math.random() * this.width);
                if (obstacleCol1 === obstacleCol2) obstacleCol2 = (obstacleCol1 + 1) % this.width;

                newRow[obstacleCol1] = 99; // 99: 파괴되지 않는 방해 블록
                if (Math.random() > 0.5) newRow[obstacleCol2] = 99;

                for (let j = 0; j < this.width; j++) {
                    if (newRow[j] === 0 && Math.random() > 0.4) {
                        newRow[j] = Math.floor(Math.random() * 7) + 1;
                    }
                }
                this.field[this.height - 1] = newRow;
            }

            breakLines() {
                let lines = 0;
                for (let i = this.height - 1; i >= 0; i--) {
                    let full = true;
                    for (let j = 0; j < this.width; j++) {
                        if (this.field[i][j] === 0) {
                            full = false;
                            break;
                        }
                    }

                    if (full) {
                        lines++;
                        const hasIndestructible = this.field[i].includes(99);

                        if (hasIndestructible) {
                            // 방해 블록(99) 제외 일반 블록만 삭제 후 위쪽 블록들을 열 단위로 연쇄 낙하
                            for (let j = 0; j < this.width; j++) {
                                if (this.field[i][j] !== 99) {
                                    createLineParticles(j, i, COLORS[this.field[i][j]] || "#ffffff");
                                    for (let r = i; r > 0; r--) {
                                        this.field[r][j] = this.field[r - 1][j];
                                    }
                                    this.field[0][j] = 0;
                                }
                            }
                            i++; // 줄 중력 연동 재검사
                        } else {
                            for (let j = 0; j < this.width; j++) {
                                createLineParticles(j, i, COLORS[this.field[i][j]]);
                            }
                            for (let i1 = i; i1 > 0; i1--) {
                                this.field[i1] = [...this.field[i1 - 1]];
                            }
                            this.field[0] = Array(this.width).fill(0);
                            i++;
                        }
                    }
                }

                if (lines > 0) {
                    audioEngine.playClear();
                    const points = [0, 100, 300, 500, 800][lines] || (lines * 200);
                    this.score += points;
                    this.linesCleared += lines;

                    // 라인 제거 개수에 따른 이인자 기분 상승
                    const moodBoost = [0, 15, 30, 50, 80][lines] || (lines * 25);
                    this.injahMood = Math.min(100, this.injahMood + moodBoost);
                    this.lastScoreTime = Date.now();

                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        localStorage.setItem("neon_tetris_highscore", this.highScore.toString());
                    }
                    updateUI();
                }
            }

            goDown() {
                if (!this.figure) return;
                this.figure.y++;
                if (this.intersects()) {
                    this.figure.y--;
                    this.freeze();
                }
            }

            freeze() {
                const img = this.figure.image();
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (img.includes(i * 4 + j)) {
                            this.field[i + this.figure.y][j + this.figure.x] = this.figure.color;
                        }
                    }
                }
                audioEngine.playDrop();
                this.breakLines();
                this.lockDelay = 0;
                this.lockResetCount = 0;
                this.newFigure();

                if (this.intersects()) {
                    this.state = "gameover";
                    audioEngine.playGameOver();
                    showOverlay("GAME OVER", `최종 점수: ${this.score}점`);
                }
            }

            hardDrop() {
                if (!this.figure || this.state !== "playing") return;
                this.figure.y = this.getGhostY();
                this.freeze();
                triggerScreenShake();
            }

            goSide(dx) {
                if (!this.figure) return;
                const oldX = this.figure.x;
                this.figure.x += dx;
                if (this.intersects()) {
                    this.figure.x = oldX;
                } else {
                    audioEngine.playMove();
                    this.onPieceMoved();
                }
            }

            rotate() {
                if (!this.figure) return;
                const oldRotation = this.figure.rotation;
                this.figure.rotate();
                if (this.intersects()) {
                    // 벽차기 (Wall-Kick) 1칸 완화
                    this.figure.x++;
                    if (this.intersects()) {
                        this.figure.x -= 2;
                        if (this.intersects()) {
                            this.figure.x++;
                            this.figure.rotation = oldRotation;
                            return;
                        } else {
                            audioEngine.playRotate();
                            this.onPieceMoved();
                        }
                    } else {
                        audioEngine.playRotate();
                        this.onPieceMoved();
                    }
                } else {
                    audioEngine.playRotate();
                    this.onPieceMoved();
                }
            }
        }

        const game = new TetrisGame(20, 10);
        let pressingDown = false;
        let softDropLocked = false;
        let dropCounter = 0;
        let dropInterval = 30;

        function updateUI() {
            document.getElementById("ui-score").textContent = game.score;
            document.getElementById("ui-highscore").textContent = game.highScore;
            document.getElementById("ui-lines").textContent = game.linesCleared;

            const modeBadge = document.getElementById("ui-mode-badge");
            const obstacleAlert = document.getElementById("obstacle-alert");

            if (game.mode === "HARD") {
                modeBadge.textContent = "HARD";
                modeBadge.className = "text-xs font-black font-orbitron text-rose-500 mt-0.5";
                obstacleAlert.classList.remove("hidden");
                dropInterval = 12; // 어려움 모드 기본 가속
            } else {
                modeBadge.textContent = "EASY";
                modeBadge.className = "text-xs font-black font-orbitron text-emerald-400 mt-0.5";
                obstacleAlert.classList.add("hidden");
                dropInterval = 28;
            }
        }

        function showOverlay(title, subtitle) {
            const overlay = document.getElementById("overlay");
            const overlayTitle = document.getElementById("overlay-title");
            const overlaySub = document.getElementById("overlay-sub");

            overlayTitle.textContent = title;
            overlaySub.textContent = subtitle;
            overlay.classList.remove("opacity-0", "pointer-events-none");
        }

        function hideOverlay() {
            const overlay = document.getElementById("overlay");
            overlay.classList.add("opacity-0", "pointer-events-none");
        }

        function triggerScreenShake() {
            const container = document.getElementById("game-container");
            container.classList.add("shake");
            setTimeout(() => container.classList.remove("shake"), 200);
        }

        function createLineParticles(cellX, cellY, color) {
            const px = cellX * game.zoom + game.zoom / 2;
            const py = cellY * game.zoom + game.zoom / 2;
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(px, py, color));
            }
        }

        function drawBlock(ctxTarget, x, y, color, size = game.zoom, isObstacle = false) {
            if (isObstacle) {
                // 방해 블록(99)
                ctxTarget.fillStyle = "#334155";
                ctxTarget.fillRect(x, y, size, size);
                ctxTarget.strokeStyle = "#ef4444";
                ctxTarget.lineWidth = 2;
                ctxTarget.strokeRect(x + 1, y + 1, size - 2, size - 2);

                ctxTarget.strokeStyle = "#94a3b8";
                ctxTarget.lineWidth = 1;
                ctxTarget.beginPath();
                ctxTarget.moveTo(x + 3, y + 3);
                ctxTarget.lineTo(x + size - 3, y + size - 3);
                ctxTarget.stroke();
                return;
            }

            ctxTarget.fillStyle = color;
            ctxTarget.fillRect(x + 1, y + 1, size - 2, size - 2);

            // 세련된 밝은 내부 테두리
            ctxTarget.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctxTarget.lineWidth = 1.5;
            ctxTarget.strokeRect(x + 2, y + 2, size - 4, size - 4);
        }

        function drawBoard() {
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 격자선
            ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= game.height; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * game.zoom);
                ctx.lineTo(canvas.width, i * game.zoom);
                ctx.stroke();
            }
            for (let j = 0; j <= game.width; j++) {
                ctx.beginPath();
                ctx.moveTo(j * game.zoom, 0);
                ctx.lineTo(j * game.zoom, canvas.height);
                ctx.stroke();
            }

            // 고정된 필드 블록
            for (let i = 0; i < game.height; i++) {
                for (let j = 0; j < game.width; j++) {
                    if (game.field[i][j] === 99) {
                        drawBlock(ctx, j * game.zoom, i * game.zoom, null, game.zoom, true);
                    } else if (game.field[i][j] > 0) {
                        drawBlock(ctx, j * game.zoom, i * game.zoom, COLORS[game.field[i][j]], game.zoom);
                    }
                }
            }

            // 현재 조종 중인 블록 & 고스트 블록
            if (game.figure && game.state === "playing") {
                const img = game.figure.image();
                const ghostY = game.getGhostY();

                // 1. 고스트 그림자
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (img.includes(i * 4 + j)) {
                            const gx = (game.figure.x + j) * game.zoom;
                            const gy = (ghostY + i) * game.zoom;
                            ctx.strokeStyle = COLORS[game.figure.color];
                            ctx.lineWidth = 1.5;
                            ctx.setLineDash([3, 3]);
                            ctx.strokeRect(gx + 2, gy + 2, game.zoom - 4, game.zoom - 4);
                            ctx.setLineDash([]);
                        }
                    }
                }

                // 2. 메인 블록 (바닥 접촉 중일 때 착지 유예 애니메이션 효과 적용)
                const isGrounded = game.isTouchGround();
                ctx.save();
                if (isGrounded) {
                    ctx.globalAlpha = 0.82 + 0.18 * Math.sin(Date.now() / 50);
                }
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (img.includes(i * 4 + j)) {
                            const bx = (game.figure.x + j) * game.zoom;
                            const by = (game.figure.y + i) * game.zoom;
                            drawBlock(ctx, bx, by, COLORS[game.figure.color], game.zoom);
                        }
                    }
                }
                ctx.restore();
            }

            // 파티클
            particles.forEach((p, index) => {
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function drawNext() {
            nextCtx.fillStyle = "#020617";
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (game.nextFigure) {
                const img = game.nextFigure.image();
                const size = 16;
                const offsetX = (nextCanvas.width - 4 * size) / 2;
                const offsetY = (nextCanvas.height - 4 * size) / 2;

                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        if (img.includes(i * 4 + j)) {
                            drawBlock(
                                nextCtx,
                                offsetX + j * size,
                                offsetY + i * size,
                                COLORS[game.nextFigure.color],
                                size
                            );
                        }
                    }
                }
            }
        }

        let danceFrame = 0;
        function drawInjahDance() {
            danceCtx.fillStyle = "#020617";
            danceCtx.fillRect(0, 0, danceCanvas.width, danceCanvas.height);

            // 시간 경과에 따른 기분 자연 감소 (게임 진행 중일 때만)
            const timeSinceScore = (Date.now() - game.lastScoreTime) / 1000;
            if (timeSinceScore > 6 && game.state === "playing") {
                game.injahMood = Math.max(0, game.injahMood - 0.12);
            }

            danceFrame++;
            const w = danceCanvas.width;
            const h = danceCanvas.height;

            const emojiEl = document.getElementById("injah-emoji");
            const statusEl = document.getElementById("injah-status");

            // --- 5단계 감정 체계 ---
            // 1단계: 절망 (0 ~ 19)
            // 2단계: 우울 (20 ~ 39)
            // 3단계: 보통 (40 ~ 59)
            // 4단계: 신남 (60 ~ 79)
            // 5단계: 광란 (80 ~ 100)

            if (game.injahMood >= 80) {
                // 🔥 5단계: 광란 (최상위 디스코 피버)
                if (emojiEl) emojiEl.textContent = "🔥";
                if (statusEl) {
                    statusEl.textContent = "기분: 광란 🔥🕺";
                    statusEl.className = "text-[9px] font-bold text-pink-400 mt-1 animate-bounce";
                }

                // 화려한 사이키 회전 레이저
                const angle = (danceFrame * 0.1) % (Math.PI * 2);
                const lightColor = `hsl(${(danceFrame * 15) % 360}, 100%, 60%)`;
                danceCtx.save();
                danceCtx.translate(w / 2, 20);
                danceCtx.strokeStyle = lightColor;
                danceCtx.lineWidth = 1.5;
                danceCtx.globalAlpha = 0.4;
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
                    danceCtx.beginPath();
                    danceCtx.moveTo(0, 0);
                    danceCtx.lineTo(Math.cos(angle + a) * 50, Math.sin(angle + a) * 50);
                    danceCtx.stroke();
                }
                danceCtx.restore();

                // 광란의 브레이크댄스 포즈
                const danceY = Math.sin(danceFrame * 0.4) * 8;
                const armAngle = Math.cos(danceFrame * 0.4) * 16;

                // 머리 & 글로우 선글라스
                danceCtx.fillStyle = "#ff007f";
                danceCtx.beginPath();
                danceCtx.arc(w / 2, h / 2 - 14 + danceY, 10, 0, Math.PI * 2);
                danceCtx.fill();

                danceCtx.fillStyle = "#00f3ff";
                danceCtx.fillRect(w / 2 - 6, h / 2 - 16 + danceY, 12, 4);

                // 몸통 & 사지
                danceCtx.strokeStyle = "#00f3ff";
                danceCtx.lineWidth = 3.5;
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 - 4 + danceY);
                danceCtx.lineTo(w / 2, h / 2 + 16 + danceY);
                danceCtx.stroke();

                // 모션 팔
                danceCtx.strokeStyle = "#ff007f";
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 - 16, h / 2 - 4 + danceY - armAngle);
                danceCtx.lineTo(w / 2 + 16, h / 2 - 4 + danceY + armAngle);
                danceCtx.stroke();

                // 모션 다리
                danceCtx.strokeStyle = "#00f3ff";
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 + 16 + danceY);
                danceCtx.lineTo(w / 2 - 12, h / 2 + 32 + danceY);
                danceCtx.moveTo(w / 2, h / 2 + 16 + danceY);
                danceCtx.lineTo(w / 2 + 12, h / 2 + 32 + danceY);
                danceCtx.stroke();

            } else if (game.injahMood >= 60) {
                // 🎵 4단계: 신남 (리듬 타는 중)
                if (emojiEl) emojiEl.textContent = "🎵";
                if (statusEl) {
                    statusEl.textContent = "기분: 신남 🎵✨";
                    statusEl.className = "text-[9px] font-bold text-emerald-300 mt-1 animate-bounce";
                }

                // 상승하는 음표 애니메이션
                danceCtx.fillStyle = "#eab308";
                danceCtx.font = "10px sans-serif";
                danceCtx.fillText("♫", w / 2 - 25 + Math.sin(danceFrame * 0.1) * 5, 25 - (danceFrame % 30));
                danceCtx.fillText("♪", w / 2 + 15 + Math.cos(danceFrame * 0.1) * 5, 30 - ((danceFrame + 15) % 30));

                const danceY = Math.sin(danceFrame * 0.2) * 5;

                // 머리
                danceCtx.fillStyle = "#10b981";
                danceCtx.beginPath();
                danceCtx.arc(w / 2, h / 2 - 12 + danceY, 9, 0, Math.PI * 2);
                danceCtx.fill();

                // 몸통
                danceCtx.strokeStyle = "#10b981";
                danceCtx.lineWidth = 3;
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 - 3 + danceY);
                danceCtx.lineTo(w / 2, h / 2 + 15 + danceY);
                danceCtx.stroke();

                // 만세형 팔 댄스
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 - 14, h / 2 - 10 + danceY);
                danceCtx.lineTo(w / 2, h / 2 + danceY);
                danceCtx.lineTo(w / 2 + 14, h / 2 - 10 + danceY);
                danceCtx.stroke();

                // 다리
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 + 15 + danceY);
                danceCtx.lineTo(w / 2 - 9, h / 2 + 29 + danceY);
                danceCtx.moveTo(w / 2, h / 2 + 15 + danceY);
                danceCtx.lineTo(w / 2 + 9, h / 2 + 29 + danceY);
                danceCtx.stroke();

            } else if (game.injahMood >= 40) {
                // 😐 3단계: 보통 (평온한 스텝)
                if (emojiEl) emojiEl.textContent = "😐";
                if (statusEl) {
                    statusEl.textContent = "기분: 보통 😐";
                    statusEl.className = "text-[9px] font-bold text-cyan-300 mt-1";
                }

                const danceX = Math.sin(danceFrame * 0.1) * 4;

                // 머리
                danceCtx.fillStyle = "#38bdf8";
                danceCtx.beginPath();
                danceCtx.arc(w / 2 + danceX, h / 2 - 10, 8, 0, Math.PI * 2);
                danceCtx.fill();

                // 몸통
                danceCtx.strokeStyle = "#38bdf8";
                danceCtx.lineWidth = 3;
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 + danceX, h / 2 - 2);
                danceCtx.lineTo(w / 2 + danceX, h / 2 + 16);
                danceCtx.stroke();

                // 나란히 팔
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 - 10 + danceX, h / 2 + 4);
                danceCtx.lineTo(w / 2 + 10 + danceX, h / 2 + 4);
                danceCtx.stroke();

                // 다리
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 + danceX, h / 2 + 16);
                danceCtx.lineTo(w / 2 - 7 + danceX, h / 2 + 28);
                danceCtx.moveTo(w / 2 + danceX, h / 2 + 16);
                danceCtx.lineTo(w / 2 + 7 + danceX, h / 2 + 28);
                danceCtx.stroke();

            } else if (game.injahMood >= 20) {
                // 🌧️ 2단계: 우울 (빗줄기와 숙인 자세)
                if (emojiEl) emojiEl.textContent = "🌧️";
                if (statusEl) {
                    statusEl.textContent = "기분: 우울 🌧️";
                    statusEl.className = "text-[9px] font-bold text-blue-400 mt-1";
                }

                // 먹구름 & 빗줄기
                danceCtx.fillStyle = "#475569";
                danceCtx.beginPath();
                danceCtx.arc(w / 2 - 8, 16, 8, 0, Math.PI * 2);
                danceCtx.arc(w / 2 + 8, 16, 10, 0, Math.PI * 2);
                danceCtx.fill();

                danceCtx.fillStyle = "#60a5fa";
                const rainY = (danceFrame * 2) % 25;
                danceCtx.fillRect(w / 2 - 5, 22 + rainY, 1.5, 3);
                danceCtx.fillRect(w / 2 + 4, 20 + ((rainY + 12) % 25), 1.5, 3);

                // 고개 숙인 캐릭터
                danceCtx.fillStyle = "#64748b";
                danceCtx.beginPath();
                danceCtx.arc(w / 2, h / 2 + 2, 7, 0, Math.PI * 2);
                danceCtx.fill();

                danceCtx.strokeStyle = "#64748b";
                danceCtx.lineWidth = 2.5;
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 + 9);
                danceCtx.lineTo(w / 2, h / 2 + 22);
                danceCtx.stroke();

                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 + 12);
                danceCtx.lineTo(w / 2 - 8, h / 2 + 20);
                danceCtx.moveTo(w / 2, h / 2 + 12);
                danceCtx.lineTo(w / 2 + 8, h / 2 + 20);
                danceCtx.stroke();

                danceCtx.beginPath();
                danceCtx.moveTo(w / 2, h / 2 + 22);
                danceCtx.lineTo(w / 2 - 5, h / 2 + 30);
                danceCtx.moveTo(w / 2, h / 2 + 22);
                danceCtx.lineTo(w / 2 + 5, h / 2 + 30);
                danceCtx.stroke();

            } else {
                // 💀 1단계: 절망 (좌절과 붉은 섬광)
                if (emojiEl) emojiEl.textContent = "💀";
                if (statusEl) {
                    statusEl.textContent = "기분: 절망 💀⚡";
                    statusEl.className = "text-[9px] font-bold text-red-500 mt-1 animate-pulse";
                }

                // 붉은 번개 깜빡임 효과
                if (danceFrame % 20 < 3) {
                    danceCtx.fillStyle = "rgba(239, 68, 68, 0.25)";
                    danceCtx.fillRect(0, 0, w, h);

                    danceCtx.strokeStyle = "#ef4444";
                    danceCtx.lineWidth = 2;
                    danceCtx.beginPath();
                    danceCtx.moveTo(w / 2 + 10, 5);
                    danceCtx.lineTo(w / 2 - 5, 20);
                    danceCtx.lineTo(w / 2 + 5, 22);
                    danceCtx.lineTo(w / 2 - 10, 38);
                    danceCtx.stroke();
                }

                // 무릎 꿇고 엎드린 절망 포즈 (좌절)
                danceCtx.fillStyle = "#991b1b";
                danceCtx.beginPath();
                danceCtx.arc(w / 2 - 10, h / 2 + 12, 7, 0, Math.PI * 2); // 푹 숙인 머리
                danceCtx.fill();

                danceCtx.strokeStyle = "#7f1d1d";
                danceCtx.lineWidth = 3;
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 - 4, h / 2 + 14);
                danceCtx.lineTo(w / 2 + 10, h / 2 + 18); // 구부정한 등
                danceCtx.lineTo(w / 2 + 14, h / 2 + 28); // 접힌 무릎
                danceCtx.stroke();

                // 땅에 짚은 팔
                danceCtx.beginPath();
                danceCtx.moveTo(w / 2 - 5, h / 2 + 16);
                danceCtx.lineTo(w / 2 - 14, h / 2 + 26);
                danceCtx.stroke();
            }
        }

        function render() {
            dropCounter++;

            if (game.state === "playing") {
                if (!game.figure) game.newFigure();

                if (game.mode === "HARD") {
                    const elapsedSec = Math.floor((Date.now() - game.lastObstacleTime) / 1000);
                    game.obstacleTimer = Math.max(0, 30 - elapsedSec);
                    const uiObstacleTimer = document.getElementById("ui-obstacle-timer");
                    if (uiObstacleTimer) uiObstacleTimer.textContent = `${game.obstacleTimer}s`;

                    if (game.obstacleTimer <= 0) {
                        game.spawnObstacleRow();
                        game.lastObstacleTime = Date.now();
                    }
                }

                const isSoftDropping = pressingDown && !softDropLocked;
                const currentInterval = isSoftDropping ? 1 : dropInterval;

                // 바닥 착지 시 현재 낙하 속도(currentInterval)에 비례한 Lock Delay 적용
                if (game.isTouchGround()) {
                    const maxLockDelay = Math.max(10, Math.round(currentInterval * 1.3));
                    game.lockDelay++;
                    if (game.lockDelay >= maxLockDelay) {
                        game.freeze();
                    }
                } else {
                    game.lockDelay = 0;
                    if (dropCounter % currentInterval === 0) {
                        game.goDown();
                    }
                }
            }

            drawBoard();
            drawNext();
            drawInjahDance();

            requestAnimationFrame(render);
        }

        window.addEventListener("keydown", (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }

            audioEngine.init();

            if (game.state !== "playing") return;

            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                game.goSide(-1);
            } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                game.goSide(1);
            } else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
                game.rotate();
            } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
                if (!pressingDown && !softDropLocked) {
                    game.goDown();
                    dropCounter = 0;
                }
                pressingDown = true;
            } else if (e.key === " ") {
                game.hardDrop();
            } else if (e.key === "r" || e.key === "R") {
                game.startGame(game.mode);
            } else if (e.key === "Escape") {
                game.state = "main_menu";
                showOverlay("NEON TETRIS", "원하는 난이도를 선택하여 시작하세요");
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
                pressingDown = false;
                softDropLocked = false;
            }
        });

        function bindBtn(id, onPressStart, onPressEnd) {
            const btn = document.getElementById(id);
            if (!btn) return;

            const handleStart = (e) => {
                e.preventDefault();
                audioEngine.init();
                onPressStart();
            };

            const handleEnd = (e) => {
                e.preventDefault();
                if (onPressEnd) onPressEnd();
            };

            btn.addEventListener("touchstart", handleStart, { passive: false });
            btn.addEventListener("touchend", handleEnd, { passive: false });
            btn.addEventListener("mousedown", handleStart);
            btn.addEventListener("mouseup", handleEnd);
            btn.addEventListener("mouseleave", handleEnd);
        }

        bindBtn("ctrl-left", () => { if (game.state === "playing") game.goSide(-1); });
        bindBtn("ctrl-right", () => { if (game.state === "playing") game.goSide(1); });
        bindBtn("ctrl-rotate", () => { if (game.state === "playing") game.rotate(); });
        bindBtn("ctrl-down", 
            () => { 
                if (game.state === "playing") {
                    if (!pressingDown && !softDropLocked) {
                        game.goDown();
                        dropCounter = 0;
                    }
                    pressingDown = true; 
                }
            }, 
            () => { pressingDown = false; softDropLocked = false; }
        );
        bindBtn("ctrl-harddrop", () => { if (game.state === "playing") game.hardDrop(); });

        document.getElementById("btn-mode-easy")?.addEventListener("click", () => {
            audioEngine.init();
            game.startGame("EASY");
            hideOverlay();
        });

        document.getElementById("btn-mode-hard")?.addEventListener("click", () => {
            audioEngine.init();
            game.startGame("HARD");
            hideOverlay();
        });

        const btnBgm = document.getElementById("btn-bgm");
        btnBgm?.addEventListener("click", () => {
            const isPlaying = audioEngine.toggleBGM();
            btnBgm.textContent = isPlaying ? "🎵 BGM: ON" : "🎵 BGM: OFF";
            btnBgm.classList.toggle("text-cyan-400", isPlaying);
        });

        const btnSound = document.getElementById("btn-sound");
        btnSound?.addEventListener("click", () => {
            audioEngine.sfxEnabled = !audioEngine.sfxEnabled;
            btnSound.textContent = audioEngine.sfxEnabled ? "🔊 SFX: ON" : "🔇 SFX: OFF";
            btnSound.classList.toggle("text-cyan-400", audioEngine.sfxEnabled);
        });

        document.getElementById("btn-fullscreen")?.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        updateUI();
        requestAnimationFrame(render);
    </script>
</body>
</html>
