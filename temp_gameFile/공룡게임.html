<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHICK RUNNER</title>
<style>
  :root {
    --navy-deep: #12172A;
    --navy: #1B2138;
    --navy-light: #262E4C;
    --sand: #F2B84B;
    --sand-dim: #C99B3E;
    --coral: #FF6B4A;
    --sage: #6E8B5A;
    --sage-dark: #4F6B3E;
    --bone: #F5EFE3;
    --bone-dim: rgba(245,239,227,0.55);
    --line: rgba(245,239,227,0.14);
    --font-display: 'Courier New', Courier, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy-deep);
    color: var(--bone);
    font-family: var(--font-ui);
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  .cabinet {
    width: 100%;
    max-width: 920px;
    border: 2px solid var(--line);
    border-radius: 6px 6px 18px 18px;
    background: var(--navy);
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .marquee {
    background: linear-gradient(180deg, var(--sand) 0%, #D89C2A 100%);
    padding: 16px 22px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 6px;
    border-bottom: 2px solid var(--line);
  }

  .marquee h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(18px, 3.4vw, 26px);
    letter-spacing: 3px;
    color: var(--navy-deep);
    font-weight: 900;
  }

  .readout {
    font-family: var(--font-display);
    font-size: clamp(14px, 2.6vw, 18px);
    color: var(--navy-deep);
    display: flex;
    gap: 18px;
    font-weight: 700;
  }

  .readout span.label {
    opacity: 0.65;
    margin-right: 6px;
    font-weight: 400;
  }

  .screen-wrap {
    padding: 18px 18px 6px;
  }

  .screen-bezel {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid var(--navy-light);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35), inset 0 8px 24px rgba(0,0,0,0.35);
    background: #000;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: rgba(18,23,42,0.55);
    text-align: center;
    padding: 20px;
    pointer-events: none;
  }

  .overlay.hidden { display: none; }

  .overlay .big {
    font-family: var(--font-display);
    font-size: clamp(16px, 3vw, 22px);
    letter-spacing: 1px;
    color: var(--bone);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  .overlay .small {
    font-size: 13px;
    color: var(--bone-dim);
  }

  .controls-row {
    padding: 16px 22px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .controls-row .row-label {
    font-size: 12px;
    color: var(--bone-dim);
    margin-right: 4px;
  }

  .scene-pill {
    font-family: var(--font-ui);
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--bone);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .scene-pill:hover { border-color: var(--sand-dim); }

  .scene-pill.active {
    background: var(--sand);
    border-color: var(--sand);
    color: var(--navy-deep);
    font-weight: 700;
  }

  .scene-pill.add {
    border-style: dashed;
    color: var(--bone-dim);
  }

  .custom-panel {
    margin: 0 22px 14px;
    padding: 14px;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }

  .custom-panel.open { display: flex; }

  .custom-panel .field-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .custom-panel input[type="text"] {
    flex: 1;
    min-width: 180px;
    background: var(--navy-deep);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--bone);
    font-family: var(--font-ui);
    font-size: 13px;
  }

  .custom-panel input[type="text"]::placeholder { color: var(--bone-dim); }

  .custom-panel input[type="file"] {
    color: var(--bone-dim);
    font-size: 12px;
    max-width: 220px;
  }

  .btn {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: var(--sand);
    color: var(--navy-deep);
    cursor: pointer;
  }

  .btn:hover { background: var(--sand-dim); }

  .custom-hint {
    font-size: 11.5px;
    color: var(--bone-dim);
    line-height: 1.5;
  }

  .footer-row {
    padding: 4px 22px 20px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12.5px;
    color: var(--bone-dim);
    border-top: 1px solid var(--line);
    margin: 10px 22px 0;
    padding-top: 14px;
  }

  kbd {
    font-family: var(--font-display);
    background: var(--navy-light);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--bone);
    font-size: 11.5px;
  }

  @media (max-width: 520px) {
    .marquee { flex-direction: column; align-items: flex-start; }
    .footer-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <h1>CHICK RUNNER</h1>
    <div class="readout">
      <span><span class="label">HI</span><span id="highScoreDisplay">00000</span></span>
      <span><span class="label">SCORE</span><span id="scoreDisplay">00000</span></span>
    </div>
  </div>

  <div class="screen-wrap">
    <div class="screen-bezel">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="big" id="overlayTitle">↑ 를 눌러 시작</div>
        <div class="small" id="overlaySub">점프: ↑ / Space &nbsp;·&nbsp; 숙이기: ↓ (길게 누르기)</div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <span class="row-label">배경</span>
    <div id="sceneButtons" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    <button class="scene-pill add" id="toggleCustom" type="button">+ 나만의 배경</button>
  </div>

  <div class="custom-panel" id="customPanel">
    <div class="field-row">
      <input type="text" id="customUrl" placeholder="이미지 URL 붙여넣기 (https://...)">
      <button class="btn" id="applyUrl" type="button">URL 적용</button>
    </div>
    <div class="field-row">
      <span class="row-label" style="align-self: center;">배경 </span>
      <input type="file" id="customFile" accept="image/*">
    </div>
    <div class="field-row" style="margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line);">
      <span class="row-label" style="align-self: center;">음악 </span>
      <input type="file" id="bgmFile" accept="audio/*">
    </div>
    <div class="custom-hint">
      배경은 캔버스에 꽉 차게 잘려서 표시돼요. 추가한 배경은 위 목록에 계속 남아서 언제든 다시 고를 수 있어요.<br>
      기본적으로 신나고 긴박한 내장 BGM이 자동 재생돼요. 직접 음악 파일을 올리면 그 음악이 대신 재생됩니다!
    </div>
  </div>

  <div class="footer-row">
    <span><kbd>↑</kbd> / <kbd>Space</kbd> 점프 &nbsp; <kbd>↓</kbd> 숙이기(홀드)</span>
    <span>아이템 : ⬆️ 점프 강화 &nbsp;·&nbsp; ⚡ 스피드 강화</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const LOGICAL_W = 900;
  const LOGICAL_H = 300;
  const GROUND_Y = 235;
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  canvas.width = LOGICAL_W * dpr;
  canvas.height = LOGICAL_H * dpr;
  canvas.style.width = LOGICAL_W + 'px';
  canvas.style.height = LOGICAL_H + 'px';
  ctx.scale(dpr, dpr);

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const highScoreDisplay = document.getElementById('highScoreDisplay');

  const BACKGROUNDS = [];
  const imageCache = {};

  function drawDayBackground(c, w, h, t) {
    const grad = c.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#BFE3F2');
    grad.addColorStop(1, '#EAF6EE');
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // sun
    c.fillStyle = '#FCE49A';
    c.beginPath();
    c.arc(w - 90, 62, 30, 0, Math.PI * 2);
    c.fill();

    // ground
    c.fillStyle = '#DCC28A';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  function drawDesertBackground(c, w, h, t) {
    const grad = c.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#3B2A55');
    grad.addColorStop(0.55, '#B5563C');
    grad.addColorStop(1, '#F2B84B');
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // sun low on horizon
    c.fillStyle = 'rgba(255,236,197,0.9)';
    c.beginPath();
    c.arc(w * 0.72, GROUND_Y - 60, 34, 0, Math.PI * 2);
    c.fill();

    // dune silhouette
    c.fillStyle = 'rgba(60,30,30,0.55)';
    c.beginPath();
    c.moveTo(0, GROUND_Y);
    const offset = (t * 0.01) % 60;
    for (let x = -60; x <= w + 60; x += 60) {
      const dx = x - offset;
      c.quadraticCurveTo(dx + 30, GROUND_Y - 34, dx + 60, GROUND_Y);
    }
    c.lineTo(w, GROUND_Y);
    c.closePath();
    c.fill();

    // ground
    c.fillStyle = '#8A4B2E';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  function drawSpringBackground(c, w, h, t) {
    const grad = c.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#A1C4FD');
    grad.addColorStop(1, '#FFC3A0');
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // Distant hills
    c.fillStyle = 'rgba(255, 183, 178, 0.7)';
    c.beginPath();
    c.moveTo(0, GROUND_Y);
    for(let x = 0; x <= w; x += 20) {
       c.lineTo(x, GROUND_Y - 40 - Math.sin(x * 0.01) * 20 - Math.cos(x * 0.005) * 10);
    }
    c.lineTo(w, GROUND_Y);
    c.fill();

    // ground
    c.fillStyle = '#9DC871';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  function drawBeachBackground(c, w, h, t) {
    const grad = c.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#4FACFE');
    grad.addColorStop(1, '#C6F8FF');
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // sun
    c.fillStyle = '#FFD700';
    c.beginPath();
    c.arc(120, 70, 25, 0, Math.PI * 2);
    c.fill();

    // sea horizon
    c.fillStyle = '#2980B9';
    c.fillRect(0, GROUND_Y - 20, w, 24);

    // ground (sand)
    c.fillStyle = '#E8C37C';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  function drawBrightNightBackground(c, w, h, t) {
    const grad = c.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#2B4162');
    grad.addColorStop(1, '#FA9C7A'); // sunset-like bright night
    c.fillStyle = grad;
    c.fillRect(0, 0, w, h);

    // moon
    c.fillStyle = 'rgba(255, 253, 224, 0.9)';
    c.beginPath();
    c.arc(w - 120, 80, 35, 0, Math.PI * 2);
    c.fill();

    // stars
    c.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 30; i++) {
      const sx = (i * 183.5) % w;
      const sy = (i * 91.3) % (GROUND_Y - 60);
      const twinkle = 0.5 + 0.5 * Math.abs(Math.sin(t * 0.003 + i));
      c.globalAlpha = twinkle;
      c.fillRect(sx, sy, 2, 2);
    }
    c.globalAlpha = 1;

    // ground
    c.fillStyle = '#423A52';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  function drawImageBackground(c, w, h, bg) {
    let img = imageCache[bg.id];
    if (!img) {
      img = new Image();
      img.src = bg.src;
      imageCache[bg.id] = img;
    }
    if (!img.complete || img.naturalWidth === 0) {
      c.fillStyle = '#20263B';
      c.fillRect(0, 0, w, h);
      return;
    }
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const canvasRatio = w / h;
    const imgRatio = iw / ih;
    let sx, sy, sw, sh;
    if (imgRatio > canvasRatio) {
      sh = ih;
      sw = ih * canvasRatio;
      sx = (iw - sw) / 2;
      sy = 0;
    } else {
      sw = iw;
      sh = iw / canvasRatio;
      sx = 0;
      sy = (ih - sh) / 2;
    }
    c.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    c.fillStyle = 'rgba(20,20,30,0.18)';
    c.fillRect(0, 0, w, h);
    c.fillStyle = '#5B4B3A';
    c.fillRect(0, GROUND_Y + 4, w, h - GROUND_Y - 4);
  }

  BACKGROUNDS.push(
    { id: 'day', label: '낮', type: 'procedural', draw: drawDayBackground, obsColors: { cactus: '#4F6B3E', bird: '#6E4B6E' } },
    { id: 'spring', label: '봄낮', type: 'procedural', draw: drawSpringBackground, obsColors: { cactus: '#2A5C2B', bird: '#5E3A5E' } },
    { id: 'beach', label: '바다', type: 'procedural', draw: drawBeachBackground, obsColors: { cactus: '#1E6335', bird: '#8B3A3A' } },
    { id: 'bright-night', label: '초저녁', type: 'procedural', draw: drawBrightNightBackground, obsColors: { cactus: '#90B290', bird: '#D1A3C4' } },
    { id: 'desert', label: '사막 노을', type: 'procedural', draw: drawDesertBackground, obsColors: { cactus: '#2D382D', bird: '#2A1F2A' } }
  );

  let currentBackgroundId = 'day';

  function renderSceneButtons() {
    const wrap = document.getElementById('sceneButtons');
    wrap.innerHTML = '';
    BACKGROUNDS.forEach((bg) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'scene-pill' + (bg.id === currentBackgroundId ? ' active' : '');
      btn.textContent = bg.label;
      btn.addEventListener('click', () => {
        currentBackgroundId = bg.id;
        renderSceneButtons();
      });
      wrap.appendChild(btn);
    });
  }

  window.addDinoBackground = function (bg) {
    if (!bg || !bg.id || !bg.label) return;
    const existingIndex = BACKGROUNDS.findIndex((b) => b.id === bg.id);
    if (existingIndex >= 0) BACKGROUNDS[existingIndex] = bg;
    else BACKGROUNDS.push(bg);
    currentBackgroundId = bg.id;
    renderSceneButtons();
  };

  renderSceneButtons();

  const toggleCustomBtn = document.getElementById('toggleCustom');
  const customPanel = document.getElementById('customPanel');
  toggleCustomBtn.addEventListener('click', () => {
    customPanel.classList.toggle('open');
  });

  document.getElementById('applyUrl').addEventListener('click', () => {
    const val = document.getElementById('customUrl').value.trim();
    if (!val) return;
    const id = 'custom-url-' + Date.now();
    window.addDinoBackground({ id, label: '커스텀', type: 'image', src: val });
  });

  document.getElementById('customFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const id = 'custom-file-' + Date.now();
      window.addDinoBackground({ id, label: '커스텀', type: 'image', src: reader.result });
    };
    reader.readAsDataURL(file);
  });

  // --- Background Music (BGM) Setup ---
  let bgmAudio = new Audio();
  bgmAudio.loop = true;
  bgmAudio.volume = 0.5; // 배경음악 볼륨 50%

  document.getElementById('bgmFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      bgmAudio.src = reader.result;
      if (gameState === 'running') {
        stopProceduralBgm();
        bgmAudio.play().catch(err => console.log("Audio play error:", err));
      }
    };
    reader.readAsDataURL(file);
  });
  // ------------------------------------

  function drawBackground(t) {
    const bg = BACKGROUNDS.find((b) => b.id === currentBackgroundId) || BACKGROUNDS[0];
    if (bg.type === 'procedural') bg.draw(ctx, LOGICAL_W, LOGICAL_H, t);
    else drawImageBackground(ctx, LOGICAL_W, LOGICAL_H, bg);
  }

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { audioCtx = null; }
      if (audioCtx) setupBgmGraph();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.05;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  // === 절차적 배경음악 (신나고 긴박한 칩튠 체이스 테마) ===
  let bgmMasterGain = null;   
  let bgmFilter = null;       
  let bgmHatGain = null;      
  let bgmNoiseBuffer = null;  
  let bgmSchedulerTimer = null;
  let bgmNextNoteTime = 0;
  let bgmStep = 0;
  let bgmPlaying = false;

  const BGM_ROOT = 220;           // A3
  const BGM_TEMPO = 172;          // 빠르고 급박한 템포 (BPM)
  const BGM_STEP_DUR = 60 / BGM_TEMPO / 2; // 8분음표 간격
  const BGM_LOOKAHEAD_MS = 25;
  const BGM_SCHEDULE_AHEAD = 0.12;

  // 16스텝(2마디) 루프
  const bgmBassPattern = [0, null, 0, null, 3, null, 0, 7, 0, null, 0, null, 8, null, 11, null];
  const bgmLeadPattern = [null, 12, null, 15, null, 12, null, null, null, 12, null, 15, null, 19, null, 23];
  const bgmKickSteps = [0, 4, 8, 12];

  function noteFreq(semitoneOffset) {
    return BGM_ROOT * Math.pow(2, semitoneOffset / 12);
  }

  function setupBgmGraph() {
    bgmMasterGain = audioCtx.createGain();
    bgmMasterGain.gain.value = 0;
    bgmMasterGain.connect(audioCtx.destination);

    bgmFilter = audioCtx.createBiquadFilter();
    bgmFilter.type = 'lowpass';
    bgmFilter.frequency.value = 1200;
    bgmFilter.Q.value = 0.7;
    bgmFilter.connect(bgmMasterGain);

    bgmHatGain = audioCtx.createGain();
    bgmHatGain.gain.value = 0.5;
    bgmHatGain.connect(bgmMasterGain);

    // 하이햇용 화이트노이즈 버퍼 (한 번만 생성)
    const bufSize = audioCtx.sampleRate * 0.05;
    bgmNoiseBuffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = bgmNoiseBuffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  }

  function playBgmTone(freq, time, dur, type, peakVol, dest) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(peakVol, time + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain);
    gain.connect(dest);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  }

  function playBgmKick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(48, time + 0.12);
    gain.gain.setValueAtTime(0.28, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
    osc.connect(gain);
    gain.connect(bgmMasterGain);
    osc.start(time);
    osc.stop(time + 0.2);
  }

  function playBgmHat(time) {
    const src = audioCtx.createBufferSource();
    src.buffer = bgmNoiseBuffer;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.16, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
    src.connect(hp);
    hp.connect(gain);
    gain.connect(bgmHatGain);
    src.start(time);
    src.stop(time + 0.04);
  }

  function scheduleBgmStep(step, time) {
    playBgmHat(time);
    if (bgmKickSteps.indexOf(step) !== -1) playBgmKick(time);

    const bassNote = bgmBassPattern[step];
    if (bassNote !== null) {
      playBgmTone(noteFreq(bassNote - 12), time, BGM_STEP_DUR * 0.92, 'sawtooth', 0.22, bgmFilter);
    }
    const leadNote = bgmLeadPattern[step];
    if (leadNote !== null) {
      playBgmTone(noteFreq(leadNote), time, BGM_STEP_DUR * 0.85, 'square', 0.1, bgmFilter);
    }
  }

  function bgmSchedulerTick() {
    while (bgmNextNoteTime < audioCtx.currentTime + BGM_SCHEDULE_AHEAD) {
      scheduleBgmStep(bgmStep, bgmNextNoteTime);
      bgmNextNoteTime += BGM_STEP_DUR;
      bgmStep = (bgmStep + 1) % bgmBassPattern.length;
    }
  }

  function startProceduralBgm() {
    if (!audioCtx || bgmPlaying) return;
    bgmPlaying = true;
    bgmStep = 0;
    bgmNextNoteTime = audioCtx.currentTime + 0.05;
    bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
    bgmMasterGain.gain.linearRampToValueAtTime(0.42, audioCtx.currentTime + 0.4);
    bgmSchedulerTimer = setInterval(bgmSchedulerTick, BGM_LOOKAHEAD_MS);
  }

  function stopProceduralBgm() {
    if (!bgmPlaying) return;
    bgmPlaying = false;
    if (bgmSchedulerTimer) { clearInterval(bgmSchedulerTimer); bgmSchedulerTimer = null; }
    if (audioCtx && bgmMasterGain) {
      bgmMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmMasterGain.gain.setValueAtTime(bgmMasterGain.gain.value, audioCtx.currentTime);
      bgmMasterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    }
  }

  function updateBgmIntensity(speed) {
    if (!bgmPlaying || !bgmFilter || !audioCtx) return;
    const t = Math.max(0, Math.min(1, (speed - 6) / (MAX_SPEED - 6)));
    const cutoff = 1000 + t * 3200;
    bgmFilter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.25);
  }
  // === BGM 엔진 끝 ===

  const STAND_W = 44, STAND_H = 44;
  const DUCK_W = 58, DUCK_H = 26;

  const dino = {
    x: 60,
    y: GROUND_Y - STAND_H,
    vy: 0,
    width: STAND_W,
    height: STAND_H,
    state: 'run', // 'run' | 'jump' | 'duck'
    duckHeld: false,
    legFrame: 0,
    legTimer: 0
  };

  let effectTimers = { jump: 0, speed: 0 };

  function resetDino() {
    dino.y = GROUND_Y - STAND_H;
    dino.vy = 0;
    dino.width = STAND_W;
    dino.height = STAND_H;
    dino.state = 'run';
    dino.duckHeld = false;
    effectTimers = { jump: 0, speed: 0 };
    collisionGraceStartedAt = -Infinity;
  }

  function jump() {
    if (dino.state !== 'jump') {
      const speedRatio = Math.min(1, Math.max(0, (gameSpeed - 6) / (14 - 6))); 
      const currentJumpVel = -15.5 - (speedRatio * 2.5); 
      const currentJumpBoostVel = -19.0 - (speedRatio * 3.0); 

      dino.vy = (effectTimers.jump > 0) ? currentJumpBoostVel : currentJumpVel;
      dino.state = 'jump';
      dino.width = STAND_W;
      dino.height = STAND_H;
      beep(720, 0.08, 'square', 0.04);
    }
  }

  function updateDino(dt) {
    const grounded = dino.state !== 'jump';

    if (grounded) {
      if (dino.duckHeld) {
        dino.state = 'duck';
        dino.width = DUCK_W;
        dino.height = DUCK_H;
      } else {
        dino.state = 'run';
        dino.width = STAND_W;
        dino.height = STAND_H;
      }
      dino.y = GROUND_Y - dino.height;
    } else {
      const speedRatio = Math.min(1, Math.max(0, (gameSpeed - 6) / (14 - 6)));
      const curGravity = 1.2 + (speedRatio * 0.6); 
      const curFastFall = 3.4 + (speedRatio * 0.8); 
      const g = dino.duckHeld ? curFastFall : curGravity;

      dino.vy += g * dt;
      dino.y += dino.vy * dt;
      if (dino.y >= GROUND_Y - STAND_H) {
        dino.y = GROUND_Y - STAND_H;
        dino.vy = 0;
        dino.state = dino.duckHeld ? 'duck' : 'run';
        dino.width = dino.state === 'duck' ? DUCK_W : STAND_W;
        dino.height = dino.state === 'duck' ? DUCK_H : STAND_H;
      }
    }

    dino.legTimer += dt;
    if (dino.legTimer > 6) {
      dino.legTimer = 0;
      dino.legFrame = 1 - dino.legFrame;
    }
  }

  // 자연스러운 병아리 렌더링 함수 (가장자리에만 얇은 테두리 추가)
  function drawChickShape(x, y, w, h, state, legFrame, alpha = 1, tint = null) {
    ctx.save();
    ctx.globalAlpha = alpha;
    
    const mainColor = tint ? tint : '#FFE600'; 
    const tailColor = tint ? tint : '#FFD700';
    const outlineColor = '#111'; // 얇은 검은색 외곽선

    // 1. 다리 그리기
    const drawLegs = (isOutline) => {
      if (isOutline) {
        ctx.fillStyle = outlineColor; ctx.strokeStyle = outlineColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      } else {
        ctx.fillStyle = '#FF8C00';
      }
      const drawRect = (lx, ly, lw, lh) => {
        ctx.beginPath(); ctx.rect(lx, ly, lw, lh);
        if (isOutline) ctx.stroke(); ctx.fill();
      };

      if (state === 'duck') {
        const legOffset = legFrame === 0 ? 0 : 4;
        drawRect(x + 15 + legOffset, y + h, 4, 6);
        drawRect(x + w - 25 - legOffset, y + h, 4, 6);
      } else {
        if (state === 'jump') {
          drawRect(x + 12, y + h - 2, 4, 8);
          drawRect(x + 24, y + h - 2, 4, 8);
        } else {
          if (legFrame === 0) {
            drawRect(x + 12, y + h - 2, 4, 8);
            drawRect(x + 26, y + h - 4, 4, 6);
          } else {
            drawRect(x + 12, y + h - 4, 4, 6);
            drawRect(x + 24, y + h - 2, 4, 8);
          }
        }
      }
    };
    drawLegs(true); drawLegs(false);

    // 2. 꼬리 그리기
    const drawTail = (isOutline) => {
      if (state === 'duck') return;
      if (isOutline) {
        ctx.fillStyle = outlineColor; ctx.strokeStyle = outlineColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      } else {
        ctx.fillStyle = tailColor;
      }
      ctx.beginPath(); 
      ctx.moveTo(x - 6, y + h - 15); 
      ctx.lineTo(x + 6, y + h - 25); 
      ctx.lineTo(x + 6, y + h - 10); 
      ctx.closePath(); 
      if (isOutline) ctx.stroke();
      ctx.fill(); 
    };
    drawTail(true); drawTail(false);

    // 3. 몸통과 머리 그리기 (연결부위 자연스럽게 합치기)
    const drawBodyHead = (isOutline) => {
      if (isOutline) {
        ctx.fillStyle = outlineColor; ctx.strokeStyle = outlineColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      } else {
        ctx.fillStyle = mainColor;
      }
      
      if (state === 'duck') {
        ctx.beginPath();
        ctx.ellipse(x + w/2, y + h - 10, w/2, h/2 + 2, 0, 0, Math.PI*2);
        if (isOutline) ctx.stroke();
        ctx.fill();
      } else {
        // 배
        ctx.beginPath();
        ctx.ellipse(x + w/2 - 4, y + h/2 - 2, w/2 - 2, h/2, 0, 0, Math.PI*2);
        if (isOutline) ctx.stroke();
        ctx.fill();
        
        // 머리
        ctx.beginPath();
        ctx.ellipse(x + w/2 + 4, y + 14, 16, 16, 0, 0, Math.PI*2);
        if (isOutline) ctx.stroke();
        ctx.fill();
        
        // 볏
        ctx.beginPath(); ctx.arc(x + w/2 + 4, y - 2, 4, 0, Math.PI, true); 
        ctx.closePath();
        if (isOutline) ctx.stroke();
        ctx.fill(); 
      }
    };
    drawBodyHead(true); drawBodyHead(false);

    // 4. 부리 그리기
    const drawBeak = (isOutline) => {
      if (isOutline) {
        ctx.fillStyle = outlineColor; ctx.strokeStyle = outlineColor; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      } else {
        ctx.fillStyle = '#FF8C00';
      }
      ctx.beginPath(); 
      if (state === 'duck') {
        ctx.moveTo(x + w - 8, y + h - 14); 
        ctx.lineTo(x + w + 4, y + h - 11); 
        ctx.lineTo(x + w - 8, y + h - 8); 
      } else {
        ctx.moveTo(x + w - 4, y + 12); 
        ctx.lineTo(x + w + 8, y + 15); 
        ctx.lineTo(x + w - 4, y + 18); 
      }
      ctx.closePath(); 
      if (isOutline) ctx.stroke();
      ctx.fill(); 
    };
    drawBeak(true); drawBeak(false);

    // 5. 눈 그리기 (눈은 제일 위에 위치하므로 마지막에 그림)
    ctx.fillStyle = outlineColor;
    ctx.beginPath(); 
    if (state === 'duck') {
      ctx.arc(x + w - 16, y + h - 14, 2.5, 0, Math.PI*2); 
    } else {
      ctx.arc(x + w - 8, y + 10, 3, 0, Math.PI*2); 
    }
    ctx.fill();
    
    ctx.restore();
  }

  function drawDino() {
    if (effectTimers.speed > 0) {
      drawChickShape(dino.x - 30, dino.y, dino.width, dino.height, dino.state, dino.legFrame, 0.2, '#60A5FA');
      drawChickShape(dino.x - 15, dino.y, dino.width, dino.height, dino.state, dino.legFrame, 0.4, '#60A5FA');
    }

    const mainColor = effectTimers.jump > 0 ? '#D9F99D' : null;
    drawChickShape(dino.x, dino.y, dino.width, dino.height, dino.state, dino.legFrame, 1, mainColor);
  }

  let obstacles = [];
  let items = [];
  let coinCount = 0;
  const COLLISION_GRACE_MS = 50;
  let collisionGraceStartedAt = -Infinity;

  function makeObstacle(type) {
    switch (type) {
      case 'cactus-small':
        return { type, width: 18, height: 34 };
      case 'cactus-large':
        return { type, width: 24, height: 46 };
      case 'cactus-cluster':
        return { type, width: 46, height: 38 };
      case 'bird-low':
        return { type, width: 34, height: 24, flyY: GROUND_Y - 30 };
      case 'bird-high':
        return { type, width: 34, height: 24, flyY: GROUND_Y - 55 }; 
      default:
        return { type: 'cactus-small', width: 18, height: 34 };
    }
  }

  function placeObstacle(ob, x) {
    ob.x = x;
    ob.y = ob.type.indexOf('cactus') === 0 ? GROUND_Y - ob.height : ob.flyY;
    return ob;
  }

  function randomSingleType() {
    const roll = Math.random();
    if (roll < 0.30) return 'cactus-small';
    if (roll < 0.55) return 'cactus-large';
    if (roll < 0.70) return 'cactus-cluster';
    if (roll < 0.85) return 'bird-low';
    return 'bird-high';
  }

  const COMBO_RECIPES = [
    ['cactus-small', 'cactus-small'],
    ['cactus-small', 'cactus-large'],
    ['cactus-large', 'cactus-small'],
    ['cactus-small', 'bird-high'],
    ['bird-high', 'cactus-small'],
    ['cactus-large', 'bird-high']
  ];

  function spawnEncounter(difficulty) {
    const comboChance = 0.15 + difficulty * 0.4; 
    let encounterEndPx = 0;

    if (Math.random() < comboChance) {
      const recipe = COMBO_RECIPES[Math.floor(Math.random() * COMBO_RECIPES.length)];
      const gapFrames = 26 + Math.random() * 16;
      const gapPx = gapFrames * gameSpeed;

      const first = placeObstacle(makeObstacle(recipe[0]), LOGICAL_W + 20);
      obstacles.push(first);
      const secondX = first.x + first.width + gapPx;
      const second = placeObstacle(makeObstacle(recipe[1]), secondX);
      obstacles.push(second);
      encounterEndPx = (secondX + second.width) - (LOGICAL_W + 20);
    } else {
      const single = placeObstacle(makeObstacle(randomSingleType()), LOGICAL_W + 20);
      obstacles.push(single);
      encounterEndPx = single.width;
    }

    const isLateGame = gameSpeed >= 8.5; 
    const itemChance = isLateGame ? 0.06 : 0.25; 

    if (Math.random() < itemChance) { 
      const type = Math.random() < 0.5 ? 'jump-boost' : 'speed-boost';
      const itemY = isLateGame 
        ? GROUND_Y - 125 - Math.random() * 25  
        : GROUND_Y - 60 - Math.random() * 40;  

      items.push({
        type: type,
        x: LOGICAL_W + 20 + encounterEndPx + 60 + Math.random() * 50,
        y: itemY,
        width: 24,
        height: 24,
        collected: false
      });
    }

    // Coins are optional and sit well behind the obstacle, at running or jumping height.
    if (Math.random() < 0.65) {
      items.push({type: 'coin', x: LOGICAL_W + 20 + encounterEndPx + 160,
        y: GROUND_Y - (Math.random() < 0.5 ? 35 : 105), width: 22, height: 22, collected: false});
    }
    return encounterEndPx;
  }

  function drawObstacle(ob) {
    const bg = BACKGROUNDS.find((b) => b.id === currentBackgroundId) || BACKGROUNDS[0];
    const colors = bg.obsColors || { cactus: '#4F6B3E', bird: '#6E4B6E' }; 

    if (ob.type.indexOf('cactus') === 0) {
      ctx.fillStyle = colors.cactus;
      const segs = ob.type === 'cactus-cluster' ? 3 : 1;
      const segW = ob.width / segs - 4;
      for (let i = 0; i < segs; i++) {
        const sx = ob.x + i * (segW + 6);
        const sh = ob.height - (i % 2 === 1 ? 8 : 0);
        const sy = ob.y + (ob.height - sh);
        ctx.fillRect(sx, sy, segW, sh);
        ctx.fillRect(sx - 5, sy + 8, 5, 8);
      }
    } else {
      // 새 (Bird) 장애물: 좌측(플레이어 방향)으로 비행하는 보라색 계열의 디테일한 새 디자인
      ctx.save();
      const flapTime = performance.now() / 80 + ob.x * 0.04;
      const flap = Math.sin(flapTime); // -1 (날개 하강) ~ +1 (날개 상승)
      const bobY = flap * 1.5; // 비행 시 부드러운 상하 바운스
      const ox = ob.x;
      const oy = ob.y + bobY;

      const mainColor = colors.bird || '#74467E';
      const wingColor = '#592D63';
      const bellyColor = '#D6B4E4';
      const outlineColor = '#210F2B';
      const beakColor = '#FF9D1B';

      // 1. 뒤쪽 날개 (원근감을 위해 몸통 뒤쪽에 먼저 렌더링)
      ctx.fillStyle = '#492252';
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      const bwx = ox + 17;
      const bwy = oy + 9;
      ctx.moveTo(bwx, bwy);
      if (flap > 0) {
        // 날개 올림
        const tipY = bwy - 10 - flap * 5;
        const tipX = bwx + 3 - flap * 2;
        ctx.quadraticCurveTo(bwx - 4, tipY + 4, tipX, tipY);
        ctx.lineTo(tipX + 4, tipY + 4);
        ctx.quadraticCurveTo(bwx + 8, bwy + 2, bwx + 6, bwy + 3);
      } else {
        // 날개 내림
        const tipY = bwy + 8 + Math.abs(flap) * 6;
        const tipX = bwx + 3;
        ctx.quadraticCurveTo(bwx - 4, tipY - 3, tipX, tipY);
        ctx.lineTo(tipX + 4, tipY - 3);
        ctx.quadraticCurveTo(bwx + 8, bwy - 1, bwx + 6, bwy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 2. 꼬리 깃털 (오른쪽 뒤편)
      ctx.fillStyle = mainColor;
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      const tx = ox + 22;
      const ty = oy + 12;
      ctx.moveTo(tx, ty - 2);
      ctx.lineTo(ox + 34, ty - 6 + flap * 1.2);
      ctx.lineTo(ox + 27, ty);
      ctx.lineTo(ox + 33, ty + 2 - flap);
      ctx.lineTo(ox + 26, ty + 4);
      ctx.lineTo(ox + 30, ty + 7);
      ctx.lineTo(tx, ty + 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 3. 몸통 & 볏 & 머리 (외곽선 + 채우기)
      ctx.fillStyle = mainColor;
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';

      // 통통하고 유선형인 몸통
      ctx.beginPath();
      ctx.ellipse(ox + 16, oy + 13, 9.5, 6.5, -0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 머리 뒤 깃털 볏 (Crest)
      ctx.beginPath();
      ctx.moveTo(ox + 10, oy + 5);
      ctx.quadraticCurveTo(ox + 13, oy - 2, ox + 15, oy - 1);
      ctx.quadraticCurveTo(ox + 12, oy + 4, ox + 9, oy + 6);
      ctx.fill();
      ctx.stroke();

      // 둥근 머리 (좌측 앞머리)
      ctx.beginPath();
      ctx.ellipse(ox + 8, oy + 9.5, 6.2, 5.8, -0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 가슴/배 깃털 (부드러운 연보라색 배면)
      ctx.fillStyle = bellyColor;
      ctx.beginPath();
      ctx.ellipse(ox + 13, oy + 14.5, 6, 3.8, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // 4. 부리 (좌측을 향해 뾰족하게 튀어나온 주황색 부리)
      ctx.fillStyle = beakColor;
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(ox + 3.5, oy + 7.5);
      ctx.lineTo(ox - 5, oy + 10.5); // 부리 끝 (왼쪽)
      ctx.lineTo(ox + 3.5, oy + 13.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 윗부리/아랫부리 분리선
      ctx.beginPath();
      ctx.moveTo(ox + 3.5, oy + 10.5);
      ctx.lineTo(ox - 3, oy + 10.5);
      ctx.stroke();

      // 볼 터치 (귀여운 분홍빛)
      ctx.fillStyle = 'rgba(235, 140, 180, 0.65)';
      ctx.beginPath();
      ctx.arc(ox + 9.5, oy + 12, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // 5. 눈 (초롱초롱하고 또렷한 눈)
      // 흰자
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(ox + 6.2, oy + 8.5, 2.5, 2.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 눈동자 (플레이어 쪽인 좌측 전방을 응시)
      ctx.fillStyle = '#180B20';
      ctx.beginPath();
      ctx.arc(ox + 5.5, oy + 8.5, 1.4, 0, Math.PI * 2);
      ctx.fill();

      // 반사광 하이라이트
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(ox + 5.1, oy + 7.8, 0.65, 0, Math.PI * 2);
      ctx.fill();

      // 6. 앞쪽 날개 (몸통 앞면에 겹쳐서 생동감 넘치게 펄럭임)
      ctx.fillStyle = wingColor;
      ctx.strokeStyle = outlineColor;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';

      const fwx = ox + 14;
      const fwy = oy + 11;

      ctx.beginPath();
      ctx.moveTo(fwx, fwy);

      if (flap > 0) {
        // 날개 펄럭임 - 위로 솟구침
        const tipY = fwy - 12 - flap * 6;
        const tipX = fwx + 2 - flap * 2;
        ctx.quadraticCurveTo(fwx - 5, tipY + 4, tipX - 1, tipY);
        // 날개 깃털 마디 디테일
        ctx.lineTo(tipX + 4, tipY + 4);
        ctx.lineTo(tipX + 6, tipY + 8);
        ctx.quadraticCurveTo(fwx + 8, fwy + 4, fwx, fwy);
      } else {
        // 날개 펄럭임 - 아래로 내림
        const tipY = fwy + 8 + Math.abs(flap) * 7;
        const tipX = fwx + 1;
        ctx.quadraticCurveTo(fwx - 5, tipY - 4, tipX - 1, tipY);
        // 날개 깃털 마디 디테일
        ctx.lineTo(tipX + 4, tipY - 3);
        ctx.lineTo(tipX + 6, tipY - 7);
        ctx.quadraticCurveTo(fwx + 7, fwy - 2, fwx, fwy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 날개 깃털 하이라이트 선
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      if (flap > 0) {
        ctx.moveTo(fwx + 1, fwy - 2);
        ctx.lineTo(fwx + 2, fwy - 8 - flap * 3);
      } else {
        ctx.moveTo(fwx + 1, fwy + 2);
        ctx.lineTo(fwx + 2, fwy + 5 + Math.abs(flap) * 3);
      }
      ctx.stroke();

      ctx.restore();
    }
  }

  function obstacleHitbox(ob) {
    const pad = ob.type.indexOf('bird') === 0 ? 4 : 3;
    return { x: ob.x + pad, y: ob.y + pad, width: ob.width - pad * 2, height: ob.height - pad * 2 };
  }

  function dinoHitbox() {
    const pad = 5;
    return { x: dino.x + pad, y: dino.y + pad, width: dino.width - pad * 2, height: dino.height - pad * 2 };
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
  }

  function drawItems(timestamp) {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.collected) continue;
      
      const floatY = it.y + Math.sin(timestamp / 150 + it.x) * 4;
      
      ctx.save();
      ctx.translate(it.x + it.width/2, floatY + it.height/2);
      
      ctx.shadowBlur = 12;
      ctx.shadowColor = it.type === 'coin' ? '#f59e0b' : it.type === 'jump-boost' ? '#4ADE80' : '#60A5FA';

      if (it.type === 'coin') {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff3b0'; ctx.fillRect(-2, -6, 4, 12);
      } else if (it.type === 'jump-boost') {
        ctx.fillStyle = '#4ADE80';
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(-10, 2);
        ctx.lineTo(-4, 2);
        ctx.lineTo(-4, 10);
        ctx.lineTo(4, 10);
        ctx.lineTo(4, 2);
        ctx.lineTo(10, 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#60A5FA';
        ctx.beginPath();
        ctx.moveTo(2, -10);
        ctx.lineTo(-8, 2);
        ctx.lineTo(-2, 2);
        ctx.lineTo(-4, 12);
        ctx.lineTo(8, -2);
        ctx.lineTo(2, -2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function applyItemEffect(type) {
    if (type === 'coin') {
      coinCount += 1;
      score += 20;
      beep(880, 0.07, 'sine', 0.06);
    } else if (type === 'jump-boost') {
      effectTimers.jump = 4000; 
      beep(600, 0.1, 'sine', 0.1); 
      setTimeout(()=>beep(800, 0.15, 'sine', 0.1), 100);
    } else if (type === 'speed-boost') {
      effectTimers.speed = 2000; // 스피드 효과 2초
      beep(1000, 0.1, 'square', 0.05); 
      setTimeout(()=>beep(1200, 0.2, 'square', 0.05), 100);
    }
  }

  function drawEffectsUI() {
    let yPos = 24;
    const barW = 120;
    
    if (effectTimers.jump > 0) {
      ctx.fillStyle = '#4ADE80';
      ctx.font = 'bold 13px var(--font-display)';
      ctx.fillText('JUMP BOOST', LOGICAL_W/2 - 130, yPos);
      ctx.fillRect(LOGICAL_W/2 - 30, yPos - 10, (effectTimers.jump / 4000) * barW, 10);
      yPos += 20;
    }
    
    if (effectTimers.speed > 0) {
      ctx.fillStyle = '#60A5FA';
      ctx.font = 'bold 13px var(--font-display)';
      ctx.fillText('SPEED BOOST', LOGICAL_W/2 - 130, yPos);
    }
  }

  let gameState = 'idle'; // 'idle' | 'running' | 'gameover'
  let distance = 0;
  let score = 0;
  let highScore = 0;
  let gameSpeed = 6;
  const MAX_SPEED = 14;
  let nextSpawnDistance = 300;
  let lastTime = null;
  let groundOffset = 0;
  let gameStartTime = null;  // 게임 시작 시각 (배경 스크롤용)
  let bgScrollOffset = 0;   // 배경 수평 오프셋

  function updateReadouts() {
    scoreDisplay.textContent = String(Math.floor(score)).padStart(5, '0');
    highScoreDisplay.textContent = String(Math.floor(highScore)).padStart(5, '0');
  }

  function startGame() {
    obstacles = [];
    items = [];
    resetDino();
    distance = 0;
    score = 0;
    coinCount = 0;
    gameSpeed = 6;
    nextSpawnDistance = 300;
    gameState = 'running';
    gameStartTime = performance.now(); // 10초 카운트 시작
    bgScrollOffset = 0;
    overlay.classList.add('hidden');
    updateReadouts();

    if (bgmAudio.src) {
      bgmAudio.play().catch(err => console.log("Audio play error:", err));
    } else {
      startProceduralBgm();
    }
  }

  function endGame() {
    gameState = 'gameover';
    highScore = Math.max(highScore, score);
    updateReadouts();
    overlayTitle.textContent = '게임 종료 · 점수 ' + Math.floor(score);
    overlaySub.textContent = '↑ 를 눌러 다시 시작';
    overlay.classList.remove('hidden');
    beep(160, 0.35, 'sawtooth', 0.05);

    bgmAudio.pause();
    bgmAudio.currentTime = 0;
    stopProceduralBgm();
  }

  function drawGround(t) {
    // 장애물 경고 구역 — 배경별 색상 결정
    // 배경 밝기에 따라 경고색과 글로우를 달리하여 어떤 배경에서도 잘 보이게
    let warnFill, warnGlow, warnTop;
    switch (currentBackgroundId) {
      case 'desert':
        // 사막: 배경이 어두운 적갈색 → 밝은 주황-노랑 계열
        warnFill = '#FFB700'; warnGlow = '#FF8800'; warnTop = '#FFE066';
        break;
      case 'bright-night':
        // 초저녁: 어두운 배경 → 핫핑크/자홍으로 대비
        warnFill = '#FF1F6E'; warnGlow = '#FF1F6E'; warnTop = '#FF99CC';
        break;
      case 'spring':
        // 봄낮: 연분홍/초록 → 진한 빨강에 흰 테두리
        warnFill = '#EE1111'; warnGlow = '#FF4444'; warnTop = '#FFFFFF';
        break;
      case 'beach':
        // 바다: 파란 하늘/모래 → 선명한 빨강
        warnFill = '#FF2222'; warnGlow = '#FF6666'; warnTop = '#FFFFFF';
        break;
      default:
        // 낮 등 밝은 배경 → 진한 빨강에 흰 상단선
        warnFill = '#EE1111'; warnGlow = '#FF3333'; warnTop = '#FFFFFF';
    }

    // 경고 거리: 고정 120px (너비 원래대로)
    const WARN_DIST = 120;
    const WARN_H = 7;
    // 2초 빠른 예고: 장애물이 화면 밖에 있어도 이 범위 안이면 오른쪽 끝에 경고 표시
    const LEAD = Math.round(gameSpeed * 60 * 2); // 2초분 픽셀 (speed6 → 약 720px)

    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (ob.x + ob.width < 0) continue; // 이미 지나간 장애물
      // LEAD 범위 밖이면 무시
      if (ob.x - WARN_DIST > LOGICAL_W + LEAD) continue;

      let drawLeft, drawRight;
      if (ob.x - WARN_DIST >= LOGICAL_W) {
        // 장애물이 아직 화면 밖: 오른쪽 끝에 고정 표시
        drawLeft = LOGICAL_W - WARN_DIST;
        drawRight = LOGICAL_W;
      } else {
        drawLeft  = Math.max(0, ob.x - WARN_DIST);
        drawRight = Math.min(ob.x, LOGICAL_W);
      }
      const clampedW = drawRight - drawLeft;
      if (clampedW <= 0) continue;

      // 근접도 (0=멀리, 1=바로 앞)
      const dist = Math.max(0, ob.x - dino.x - 50);
      const maxDist = LEAD + WARN_DIST;
      const proximity = Math.min(1, Math.max(0, 1 - dist / maxDist));
      const baseAlpha = 0.35 + 0.55 * proximity;
      const glowStr  = 3 + proximity * 14;

      ctx.save();
      ctx.shadowBlur  = glowStr;
      ctx.shadowColor = warnGlow;
      ctx.globalAlpha = Math.min(1, baseAlpha);
      ctx.fillStyle   = warnFill;
      ctx.fillRect(drawLeft, GROUND_Y - WARN_H + 2, clampedW, WARN_H);

      // 상단 밝은 테두리선
      ctx.shadowBlur  = 0;
      ctx.globalAlpha = Math.min(1, baseAlpha * 1.3);
      ctx.fillStyle   = warnTop;
      ctx.fillRect(drawLeft, GROUND_Y - WARN_H + 2, clampedW, 2);
      ctx.restore();
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(LOGICAL_W, GROUND_Y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 2;
    const dashLen = 26, gapLen = 22, period = dashLen + gapLen;
    let x = -(groundOffset % period);
    while (x < LOGICAL_W) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 8);
      ctx.lineTo(x + dashLen, GROUND_Y + 8);
      ctx.stroke();
      x += period;
    }
  }

  function frame(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 16.6667, 2.2);
    const dtRealMs = timestamp - lastTime;
    lastTime = timestamp;

    // 10초 후 배경 스크롤 오프셋 계산
    if (gameState === 'running' && gameStartTime !== null) {
      const elapsed = timestamp - gameStartTime;
      if (elapsed > 10000) {
        const scrollElapsed = elapsed - 10000;
        // 서서히 속도 증가 (최대 gameSpeed의 0.3배)
        const scrollSpeed = Math.min(gameSpeed * 0.3, (scrollElapsed / 5000) * gameSpeed * 0.3);
        bgScrollOffset += scrollSpeed * dt;
      }
    }

    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    // 배경 스크롤: ctx를 translateX로 오프셋 적용 후 원위치
    ctx.save();
    ctx.translate(-bgScrollOffset % LOGICAL_W, 0);
    drawBackground(timestamp);
    ctx.translate(LOGICAL_W, 0);
    drawBackground(timestamp);
    ctx.restore();

    if (gameState === 'running') {
      if (effectTimers.jump > 0) effectTimers.jump -= dtRealMs;
      if (effectTimers.speed > 0) effectTimers.speed -= dtRealMs;

      const speedMultiplier = (effectTimers.speed > 0) ? 1.3 : 1.0;
      const currentSpeed = gameSpeed * speedMultiplier;

      distance += currentSpeed * dt;
      groundOffset += currentSpeed * dt;
      score += currentSpeed * dt * 0.08;
      
      gameSpeed = Math.min(MAX_SPEED, 6 + score / 220);
      updateBgmIntensity(currentSpeed);

      updateDino(dt);

      if (distance >= nextSpawnDistance) {
        const difficulty = Math.min(1, score / 900);
        const encounterWidth = spawnEncounter(difficulty);
        const gap = 220 + Math.random() * 260 - (gameSpeed - 6) * 6;
        nextSpawnDistance = distance + Math.max(160, gap) + encounterWidth;
      }

      const dHitbox = dinoHitbox();

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.x -= currentSpeed * dt;
        if (it.x + it.width < -20) {
          items.splice(i, 1);
          continue;
        }
        if (!it.collected && rectsOverlap(dHitbox, it)) {
          it.collected = true;
          applyItemEffect(it.type);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= currentSpeed * dt;
        if (ob.x + ob.width < -20) {
          obstacles.splice(i, 1);
          continue;
        }
        
        if (rectsOverlap(dHitbox, obstacleHitbox(ob))) {
          if (collisionGraceStartedAt === -Infinity) collisionGraceStartedAt = timestamp;
          else if (timestamp - collisionGraceStartedAt >= COLLISION_GRACE_MS) endGame();
        }
      }
      if (!obstacles.some(ob => rectsOverlap(dHitbox, obstacleHitbox(ob)))) collisionGraceStartedAt = -Infinity;

      if (Math.floor(score) > 0 && Math.floor(score) % 200 === 0 && Math.floor(score) !== lastMilestone) {
        lastMilestone = Math.floor(score);
        beep(880, 0.12, 'square', 0.035);
      }

      updateReadouts();
    }

    drawGround(timestamp);
    drawItems(timestamp);
    obstacles.forEach(drawObstacle);
    drawDino(); 
    
    if (gameState === 'running') drawEffectsUI();
    // Keep the collection goal visible without revealing any protection timer.
    ctx.save();
    ctx.fillStyle = 'rgba(42, 31, 20, 0.82)';
    ctx.fillRect(LOGICAL_W - 122, 10, 110, 30);
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(LOGICAL_W - 106, 25, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif';
    ctx.fillText('코인 ' + coinCount, LOGICAL_W - 93, 30);
    ctx.restore();

    requestAnimationFrame(frame);
  }
  
  let lastMilestone = -1;

  function handleJumpKey() {
    ensureAudio();
    if (gameState === 'idle') { startGame(); return; }
    if (gameState === 'gameover') { startGame(); return; }
    if (gameState === 'running') jump();
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'Space') {
      e.preventDefault();
      handleJumpKey();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      dino.duckHeld = true;
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      handleJumpKey();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') {
      dino.duckHeld = false;
    }
  });

  updateReadouts();
  requestAnimationFrame(frame);
})();
</script>
</body>
