<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>모션 아케이드 · 합성 영상 인식 검증</title><style>body{background:#17131d;color:#dbc8ef;font:16px system-ui;padding:40px}button{padding:16px;background:#bd9ced;border:0;border-radius:8px}li{padding:12px}canvas{border:1px solid #51415f}</style></head><body><h1>합성 영상으로 인식 Worker 검증</h1><p>실제 카메라를 사용하지 않습니다. 빈 캔버스를 영상 프레임으로 전달합니다.</p><button id="run">모델 로드 · 실제 추론 · 오류 복구 검사</button><ol id="results"></ol><p id="status">검사 대기</p><canvas id="frame" width="640" height="480"></canvas><script type="module">
import { processImage } from '/src/core/images.ts';
import { saveCharacter,characters,deleteCharacter } from '/src/core/storage.ts';
const button=document.querySelector('#run'),status=document.querySelector('#status'),results=document.querySelector('#results'),canvas=document.querySelector('#frame');
canvas.getContext('2d').fillRect(0,0,640,480);
function message(worker,types){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{worker.terminate();reject(new Error('45초 응답 시간 초과'));},45000);const done=e=>{if(types.includes(e.data.type)){clearTimeout(timer);worker.removeEventListener('message',done);resolve(e.data);}};worker.addEventListener('message',done);worker.addEventListener('error',e=>{clearTimeout(timer);reject(new Error(e.message));},{once:true});});}
const add=t=>{const li=document.createElement('li');li.textContent=t;results.append(li);};
button.onclick=async()=>{button.disabled=true;results.textContent='';let worker=new Worker('/vision.worker.js');try{
  for(const mode of ['hand','pose','tetris']){
    status.textContent=`${mode} 모델 로드 중`;let pending=message(worker,['ready','error']);worker.postMessage({type:'init',mode,base:location.origin+'/'});let result=await pending;if(result.type==='error')throw new Error(result.message);add(`PASS: ${mode} 모델 + 0.10.32 WASM 로드`);
    status.textContent=`${mode} 합성 프레임 추론 중`;const bitmap=await createImageBitmap(canvas);pending=message(worker,['result','error']);worker.postMessage({type:'frame',bitmap,time:performance.now()},[bitmap]);result=await pending;if(result.type!=='result')throw new Error(result.message);if(result.hands.length||result.pose.length)throw new Error('빈 프레임에서 잘못된 기준점 반환');add(`PASS: ${mode} 실제 Worker 추론, 빈 영상 감지 0개, ${result.inferenceMs.toFixed(1)}ms (해당 합성 프레임 측정)`);
  }
  worker.terminate();worker=new Worker('/vision.worker.js');status.textContent='모델 로딩 오류와 재시도 확인 중';let pending=message(worker,['ready','error']);worker.postMessage({type:'init',mode:'hand',base:location.origin+'/missing-model-test/'});let result=await pending;if(result.type!=='error')throw new Error('잘못된 경로가 오류로 처리되지 않음');add('PASS: 모델 로딩 실패를 error로 보고');worker.terminate();worker=new Worker('/vision.worker.js');pending=message(worker,['ready','error']);worker.postMessage({type:'init',mode:'hand',base:location.origin+'/'});result=await pending;if(result.type!=='ready')throw new Error(result.message);add('PASS: 새 Worker로 모델 로드 재시도 성공');status.textContent='전체 검사 통과 · 실제 사람의 모션 인식은 별도 확인 필요';
  const original=await(await fetch('/tests/fixtures/character.png')).blob(),image=await createImageBitmap(original);const processed=processImage(image,80,100,{left:0,top:0,right:100,bottom:100},{enabled:true,color:'#ffffff',tolerance:5});const ctx=processed.getContext('2d');if(ctx.getImageData(0,0,1,1).data[3]!==0||ctx.getImageData(25,30,1,1).data[3]!==255)throw new Error('배경 제거 알파 검증 실패');add('PASS: 실제 Canvas 단색 배경 제거 + 그림 픽셀 보존');const crop=processImage(image,80,100,{left:25,top:10,right:75,bottom:90},{enabled:false,color:'#ffffff',tolerance:0});if(crop.width!==40||crop.height!==80)throw new Error('잘라내기 크기 실패');add('PASS: 실제 Canvas 잘라내기 40 × 80');const blob=await new Promise(resolve=>processed.toBlob(resolve,'image/png'));const id='test-'+crypto.randomUUID();await saveCharacter({id,name:'테스트 전용',original,processed:blob,flip:false,size:1,footX:.5,footY:1});const stored=(await characters()).find(c=>c.id===id);if(!stored||stored.original.size!==original.size||stored.processed.size!==blob.size)throw new Error('IndexedDB 원본·처리본 검증 실패');await deleteCharacter(id);add('PASS: IndexedDB에 원본·처리본 Blob 저장 및 읽기 (검사 데이터 정리 완료)');image.close();status.textContent='전체 검사 통과 · 실제 사람의 모션 인식과 파일 선택 UI는 별도 확인 필요';
}catch(error){add('FAIL: '+error.message);status.textContent='검사 실패';}finally{worker.terminate();button.disabled=false;}};
</script></body></html>
